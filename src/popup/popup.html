<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inertia.js DevTools</title>
    <style>
      :root {
        color-scheme: light dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        width: 280px;
        box-sizing: border-box;
        padding: 20px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #ffffff;
        color: #1f2937;
        text-align: center;
      }

      .logo {
        width: 118px;
        height: auto;
        display: block;
        margin: 0 auto 16px;
        /* The wordmark ships white (for dark backgrounds); invert it for the light popup. */
        filter: invert(1);
      }

      .notice {
        font-size: 13px;
        line-height: 1.5;
        color: #4b5563;
        margin: 0;
      }

      .hint {
        margin-top: 12px;
        font-size: 12px;
        color: #9ca3af;
      }

      kbd {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        background: #f3f4f6;
        border: 1px solid #e5e7eb;
        border-radius: 4px;
        padding: 1px 5px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #18181b;
          color: #e4e4e7;
        }

        .logo {
          filter: none;
        }

        .notice {
          color: #a1a1aa;
        }

        .hint {
          color: #71717a;
        }

        kbd {
          background: #27272a;
          border-color: #3f3f46;
        }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="./logo.svg" alt="Inertia.js" />
    <p class="notice">
      Open your browser's DevTools and select the <strong>Inertia</strong> tab to inspect requests, props, and routes.
    </p>
    <p class="hint">Toggle DevTools with <kbd>⌥⌘I</kbd> / <kbd>F12</kbd></p>
  </body>
</html>
