name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    outputs:
      notes: ${{ steps.publish.outputs.notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="inertia-devtools-extension-${version}.zip"
          (cd dist && zip -qr "../${zip}" .)
          gh release create "$GITHUB_REF_NAME" "$zip" --generate-notes

          notes="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          {
            echo "notes<<GH_NOTES_EOF"
            echo "$notes"
            echo "GH_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  changelog:
    needs: release
    permissions:
      contents: write
    uses: laravel/.github/.github/workflows/update-changelog.yml@4bf890cc0e48724d6f2061c28f2e6ff48911adbd # main
    with:
      version: ${{ github.ref_name }}
      branch: master
      notes: ${{ needs.release.outputs.notes }}
