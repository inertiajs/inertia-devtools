name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    outputs:
      notes: ${{ steps.publish.outputs.notes }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package and publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="inertia-devtools-extension-${version}.zip"
          (cd dist && zip -qr "../${zip}" .)
          gh release create "$GITHUB_REF_NAME" "$zip" --generate-notes

          notes="$(gh release view "$GITHUB_REF_NAME" --json body --jq .body)"
          {
            echo "notes<<GH_NOTES_EOF"
            echo "$notes"
            echo "GH_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  changelog:
    needs: release
    permissions:
      contents: write
    uses: laravel/.github/.github/workflows/update-changelog.yml@4bf890cc0e48724d6f2061c28f2e6ff48911adbd # main
    with:
      version: ${{ github.ref_name }}
      branch: master
      notes: ${{ needs.release.outputs.notes }}
