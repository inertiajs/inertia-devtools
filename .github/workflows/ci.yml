name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build Chrome
        run: pnpm build:chrome

      - name: Build Firefox
        run: pnpm build:firefox

      # AMO validates the bundle on submission, so catching a manifest it rejects here beats
      # finding out during a release. Warnings are informational; only errors fail the step.
      - name: Validate Firefox bundle
        run: pnpm dlx web-ext@10 lint --source-dir dist-firefox --self-hosted

      # The e2e jobs load these instead of building their own, so every browser tests the same
      # bytes and no job repeats a build. `tests/e2e/global-setup.ts` only builds what is missing.
      - name: Upload extension builds
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extension-builds
          path: |
            dist-chrome
            dist-firefox
          if-no-files-found: error
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.project }})
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    needs: build

    strategy:
      fail-fast: false
      matrix:
        include:
          # The shared suite (tests/e2e/shared) runs the same specs on both browsers through WebDriver.
          # Chrome needs Playwright's Chromium as the binary chromedriver launches.
          - project: chromium-selenium
            browser: chromium
          - project: firefox
            browser: firefox
          # The `chromium` project, the original Playwright suite, is deliberately not here while the
          # shared suite grows to cover it. Run it locally with `pnpm test:e2e:chrome`.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          extensions: mbstring, dom, xml, curl, fileinfo, tokenizer, ctype, filter, session, openssl, intl, bcmath, sqlite3, pdo_sqlite

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download extension builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: extension-builds
          path: .

      - name: Install Playwright Chromium
        if: matrix.browser == 'chromium'
        run: pnpm exec playwright install --with-deps chromium

      # A real Firefox, not Playwright's build: that one does not inject extension content scripts, so
      # the suite would pass while page state and request lineage were dead (see
      # tests/e2e/drivers/firefox.ts). geckodriver and chromedriver download themselves on first use,
      # each at a pinned version.
      - name: Install Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795 # v1.7.2
        with:
          firefox-version: latest

      # Bootstrap the app as explicit steps (not only inside the Playwright webServer
      # command) so composer/boot failures surface here with full, untruncated output.
      # The app runs through the vite dev server (started by Playwright), so no build here.
      - name: Bootstrap e2e app
        run: bash tests/e2e/app/setup.sh

      - name: Install e2e app deps
        run: pnpm --dir tests/e2e/app install

      - name: Run e2e tests
        run: pnpm exec playwright test -c tests/e2e/playwright.config.ts --project=${{ matrix.project }}
