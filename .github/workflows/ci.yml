name: CI
on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (shard ${{ matrix.shard }}/4)
    timeout-minutes: 20
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # The e2e Laravel app depends on the private inertia-laravel fork that carries
      # the devtools server. composer resolves it through a path repository pointing
      # at a sibling checkout of this repo, so clone it there before installing.
      # Remove this step once the fork is merged into public inertia-laravel and the
      # composer `repositories` override is dropped.
      - name: Checkout inertia-laravel devtools fork
        run: |
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/inertiajs/inertia-laravel-devtools.git" \
            "${{ github.workspace }}/../inertia-laravel-devtools"
        env:
          TOKEN: ${{ secrets.INERTIA_LARAVEL_DEVTOOLS_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          extensions: mbstring, dom, xml, curl, fileinfo, tokenizer, ctype, filter, session, openssl, intl, bcmath, sqlite3, pdo_sqlite

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Bootstrap the app as explicit steps (not only inside the Playwright webServer
      # command) so composer/boot failures surface here with full, untruncated output.
      # The app runs through the vite dev server (started by Playwright), so no build here.
      - name: Bootstrap e2e app
        run: bash tests/e2e/app/setup.sh

      - name: Install e2e app deps
        run: pnpm --dir tests/e2e/app install

      - name: Run e2e tests
        run: pnpm exec playwright test -c tests/e2e/playwright.config.ts --shard=${{ matrix.shard }}/4
